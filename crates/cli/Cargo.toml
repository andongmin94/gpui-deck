[package]
name = "gpui-deck-cli"
description = "Install application-owned GPUI Deck recipes, Create presets and GitHub-hosted blocks."
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"

[[bin]]
name = "gpui-deck"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui-deck = { version = "=0.0.1", path = "../base", default-features = false, features = ["recipe-sources"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
