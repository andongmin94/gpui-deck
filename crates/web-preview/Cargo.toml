[package]
name = "gpui-deck-web-preview"
description = "Live documentation previews of GPUI Deck components in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-support = ["gpui-deck/test-support"]

[dependencies]
gpui.workspace = true
gpui-deck = { path = "../base" }

[build-dependencies]
gpui-deck = { path = "../base", default-features = false, features = ["recipe-sources"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.12", default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Element", "Location", "MutationObserver", "MutationObserverInit", "UrlSearchParams", "Window"] }

[lints]
workspace = true
