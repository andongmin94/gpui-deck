[package]
name = "gpui-design-web-preview"
description = "Live documentation previews of GPUI Design components in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
gpui-design = { path = "../base" }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[lints]
workspace = true
