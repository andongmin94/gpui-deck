name: Submit a registry
description: Request a listing for your GPUI Deck registry in the directory.
title: "[Registry] "
body:
  - type: input
    id: registry-name
    attributes:
      label: Registry name
      placeholder: Acme UI
    validations:
      required: true
  - type: input
    id: catalog
    attributes:
      label: Public registry.json URL
      description: Link to your collection's catalog on GitHub.
      placeholder: https://github.com/acme/ui/blob/main/registry.json
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Example item manifest URL
      description: Pick one component or block that reviewers can install with `gpui-deck add`.
      placeholder: https://github.com/acme/ui/blob/main/items/button.json
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: About this registry
      description: Tell us what your collection offers. You can include a demo or screenshot.
