name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "blocks/**"
      - "registries/**"
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain with the wasm target
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          build-warnings: ""

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Check GPUI pins in the consumer installation examples
        run: |
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          workspace = tomllib.loads(Path("../Cargo.toml").read_text(encoding="utf-8"))["workspace"]["dependencies"]
          for page in Path("content/docs").glob("installation*.mdx"):
              snippet = re.search(r"^```toml\n(.+?)^```", page.read_text(encoding="utf-8"), re.M | re.S)
              if not snippet:
                  raise SystemExit(f"{page}: missing consumer Cargo.toml")
              deps = tomllib.loads(snippet[1])["dependencies"]
              for name in ("gpui", "gpui_platform"):
                  for key in ("package", "version"):
                      if deps[name][key] != workspace[name][key]:
                          raise SystemExit(f"{page}: {name}.{key} must match workspace.dependencies")
          PY

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Build previews and the site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
